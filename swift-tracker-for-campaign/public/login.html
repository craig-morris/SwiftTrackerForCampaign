<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — SwiftTrackerForCampaign</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <svg width="40" height="40" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="#3B82F6"/>
          <path d="M8 12l8 5 8-5" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <rect x="8" y="10" width="16" height="12" rx="2" stroke="white" stroke-width="2" fill="none"/>
        </svg>
        <h1>Welcome back</h1>
        <p class="login-subtext">Sign in to your SwiftTracker dashboard</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="password">Admin Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your admin password" required autocomplete="current-password">
          <span class="helper-text">This is the password you set in your environment variables.</span>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <span class="btn-spinner" style="display:none;">⏳</span>
        </button>
        <div id="loginError" class="form-error" style="display:none;"></div>
      </form>

      <div class="login-footer">
        <a href="/">← Back to Home</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const btnText = btn.querySelector('.btn-text');
      const btnSpinner = btn.querySelector('.btn-spinner');
      const errorDiv = document.getElementById('loginError');

      btn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline';
      errorDiv.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          window.location.href = '/dashboard.html';
        } else {
          errorDiv.textContent = data.error || 'Login failed. Please try again.';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = 'Network error. Please check your connection.';
        errorDiv.style.display = 'block';
      } finally {
        btn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
